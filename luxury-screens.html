*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,Segoe UI,sans-serif}
h1{margin:0;padding:20px 16px 4px;color:var(--g);font-weight:600}p.s{margin:0;padding:0 16px 12px;color:var(--m)}
nav{display:flex;gap:8px;padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}

.grid{display:flex;flex-wrap:wrap;gap:18px;padding:16px;justify-content:center}

.map:after{content:"";position:absolute;left:50%;top:40%;width:14px;height:14px;background:var(--g);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.sheet{background:var(--c);border-radius:16px 16px 0 0;margin:0 -10px -10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.r{background:var(--c);border:1px solid #2a2a2e;border-radius:10px;padding:8px 10px;font-size:11.5px}

.sec{padding:16px;max-width:900px;margin:auto;line-height:1.6}.sec h2{color:var(--g)}.sec li{margin-bottom:4px}

const NAV={cust:['Home','Rides','Wallet','Account'],drv:['Home','Earnings','Goals','Profile'],adm:null};
function card(t,i,k,n){const[ty,nm,el]=t.split('|'),e=el.split(',');let h='';
const rows=e.map(x=>`<div class="r">${x}</div>`).join('');
if(ty=='m')h=`<div class="map"></div><div class="sheet">${rows}</div>`;
else if(ty=='l')h=rows+rows;
else if(ty=='f')h=e.map(x=>`<div class="f">${x}</div>`).join('')+`<div class="b">Continue</div>`;
else if(ty=='d')h=`<div class="big">₹ 128</div>`+rows+`<div class="b">${e[e.length-1]}</div>`;
else if(ty=='p')h=`<div class="big">${e[0]}</div>`+rows+`<div class="b">${e[e.length-1]}</div>`;
else h=`<div class="c">${nm.toUpperCase()}</div>`+e.map(x=>`<div class="ch" style="align-self:center">${x}</div>`).join('');
const bn=n?`<div class="bn">${n.map((x,j)=>j?`<span>${x}</span>`:`<b>${x}</b>`).join('')}</div>`:'';
return`<div class="ph ${k=='adm'?'ad':''}"><div class="top">${nm}<i>${i+1}</i></div><div class="body">${h}</div>${bn}</div>`}
const R=`<div class="sec"><h2>Navigation rules</h2>
<h3>Customer app</h3><ul><li>Bottom nav (4 tabs): Home | Rides | Wallet | Account.</li><li>Booking flow is linear: Home → Search → Choose ride → Confirm → Searching → Driver found → Live ride → Summary → Payment → Rating.</li><li>During an active ride the bottom nav is hidden; a persistent ride card shows ETA and driver.</li><li>SOS floating button on every live-ride screen.</li><li>Back during a ride shows a confirm dialog and never cancels the ride.</li><li>Driver not found in 3 retries → Offer fare bump or Try again.</li><li>Out-of-zone / restricted road → alert before Confirm.</li></ul>
<h3>Driver app</h3><ul><li>Bottom nav (4 tabs): Home | Earnings | Goals | Profile.</li><li>Unapproved driver sees only the Approval tracker, Home is locked.</li><li>Ride request is a full-screen overlay with a 20s timer; timeout = auto-reject and ride_assignments.status updated.</li><li>Trip state machine without skips: Accept → Navigate → Arrived → OTP → Start → Drop → Payment → Rate customer.</li><li>Offline: Home map dims, requests stop. Fatigue limit forces the rest screen.</li><li>Fake-GPS detection blocks going online until fixed.</li></ul>
<h3>Admin website</h3><ul><li>Left sidebar + top global search + role-based menu; items hidden without admin_permissions.</li><li>Every destructive action (refund, ban, wallet adjust) needs a confirm modal and writes to audit_logs.</li><li>Ride detail links to Driver, Customer, Payment and Chat; the SOS console takes priority with a red banner everywhere.</li></ul>
<h3>Popup rules (screens + popups combined)</h3><ul><li><b>4 popup types:</b> Dialog (centred, blocking, max 2 buttons), Bottom sheet (choices/forms, swipe-down or back to dismiss), Toast (3s auto-dismiss, never blocks), Full-screen overlay (critical, back and outside tap ignored).</li><li><b>Priority:</b> Session expired / Force logout &gt; SOS &gt; Driver ride request &gt; Fatigue / Fake-GPS &gt; Payment and network errors &gt; Info dialogs &gt; Toasts. Only one blocking popup at a time; lower-priority ones queue, toasts never queue.</li><li><b>Back press:</b> Dialog = same as secondary button; Sheet = dismiss; Full-screen = ignored. During an active ride, back never cancels the ride.</li><li><b>Outside tap:</b> dismisses Sheets only. Destructive dialogs (Cancel ride, Logout, Ban, Delete) never close on outside tap.</li><li><b>Route stack:</b> popups do not add to the back stack. Primary button either returns to the calling screen with a result or pushes the next screen (e.g. Driver arrived → Share OTP, Payment failed → Payment method).</li><li><b>Flow triggers (Customer):</b> Pickup confirm sheet → Surge / Fare changed → Searching; No driver found dialog after 3 retries; Driver arrived overlay → Ride in progress; Ride ended → Payment → Tip sheet → Rate prompt.</li><li><b>Flow triggers (Driver):</b> Go online dialog checks docs, GPS and fatigue; Ride request overlay (20s) → Navigate; Wrong OTP dialog blocks Start; Cash collect sheet → Rate customer; Fatigue overlay forces offline until the rest timer ends.</li><li><b>Admin:</b> every destructive dialog asks for a reason and writes audit_logs; refunds above the set limit need MFA re-auth; Session timeout overlay clears the sidebar state.</li><li><b>SOS:</b> Send-SOS dialog appears on Customer and Driver, a hold-to-confirm button prevents accidental triggers, and Admin receives a red banner plus the SOS console.</li><li><b>Offline:</b> No-internet dialog only blocks network actions; the live ride and map keep working with the last known state.</li><li><b>Every popup:</b> has a loading state on its primary button, an error toast on failure, and sends no analytics event until a button is tapped.</li></ul><h3>Common</h3><ul><li>Every screen has loading, empty and error states.</li><li>Money is stored in cents and shown in ₹.</li><li>Auth only via Firebase; Supabase is for data only.</li></ul></div>`;

function pc(t,i,k){const[ty,nm,bd,bt]=t.split('|'),B=bt.split('/').filter(x=>x!='—');

else o=`<div class="ov ${ty=='b'?'bt':ty=='x'?'full':''}"><div class="dl ${ty=='b'?'sh':''}"><b>${nm}</b><span>${bd}</span>${bs}</div></div>`;

function popView(){return`<p class="lg">Dialog = centred, blocking · Sheet = bottom, swipe-down · Toast = 3s, non-blocking · Full = critical, no dismiss</p>`+[['cust','Customer popups (24)'],['drv','Driver popups (24)'],['adm','Admin popups (20)']].map(([k,l])=>`<h2 class="ph2">${l}</h2><div class="grid">${P[k].split('\n').map((t,i)=>pc(t,i,k)).join('')}</div>`).join('')}
const T=[['cust','Customer (50)'],['drv','Driver (50)'],['adm','Admin (30)'],['pop','Popups (68)'],['nav','Navigation rules']];
const tb=document.getElementById('tabs'),v=document.getElementById('v');
function show(k){[...tb.children].forEach((b,i)=>b.classList.toggle('on',T[i][0]==k));
v.innerHTML=k=='nav'?R:k=='pop'?popView():`<div class="grid">${D[k].split('\n').map((t,i)=>card(t,i,k,t.startsWith('m|')||t.startsWith('d|Wallet')||/^(l\|(Ride history))/.test(t)?NAV[k]:null)).join('')}</div>`}
T.forEach(t=>{const b=document.createElement('button');b.textContent=t[1];b.onclick=()=>show(t[0]);tb.append(b)});
show('cust');
