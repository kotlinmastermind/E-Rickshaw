name: Render Backend Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -f -s -m 60 https://e-rickshaw-z32z.onrender.com/health/live || echo "Server is waking up"
