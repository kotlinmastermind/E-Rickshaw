name: CI Checks (Backend, PostgreSQL 18, Redis, Android, Static)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: erickshaw_test
          POSTGRES_PASSWORD: erickshaw_test_password
          POSTGRES_DB: erickshaw_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erickshaw_test -d erickshaw_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify PostgreSQL 18 and Redis services
        env:
          DATABASE_URL: "postgresql+asyncpg://erickshaw_test:erickshaw_test_password@127.0.0.1:5432/erickshaw_test_db"
          REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
        run: |
          python - <<'PY'
          import asyncio
          import os
          from sqlalchemy.ext.asyncio import create_async_engine
          import redis.asyncio as redis

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  version = (await conn.exec_driver_sql("SELECT version()")).scalar_one()
                  print(version)
                  assert "PostgreSQL 18" in version, version
              await engine.dispose()

              client = redis.from_url(os.environ["REDIS_TEST_URL"], decode_responses=True)
              assert await client.ping() is True
              print("Redis service ping: PASS")
              await client.aclose()

          asyncio.run(main())
          PY

      - name: Static security and Google FCM-only checks
        run: |
          python -m compileall -q backend database
          python -c "
          import pathlib, sys
          bad = []
          admin_html = pathlib.Path('backend/static/admin/index.html')
          if not admin_html.is_file():
              bad.append(f'Missing required admin HTML: {admin_html}')
          # Google Fonts (fonts.googleapis.com / fonts.gstatic.com) are explicitly allowed.
          # Enforce Google FCM-only push notifications (no third-party push SDKs).
          disallowed_push = ('com.onesignal', 'com.pusher.pushnotifications', 'com.urbanairship', 'com.clevertap')
          for root_dir in ('apps', 'backend'):
              for p in pathlib.Path(root_dir).rglob('*'):
                  if p.suffix in ('.kt', '.java', '.py', '.kts', '.gradle') and p.is_file():
                      txt = p.read_text(encoding='utf-8', errors='ignore')
                      for sdk in disallowed_push:
                          if sdk in txt:
                              bad.append(f'Non-FCM push SDK ({sdk}) found in {p}')
                      if p.suffix == '.kt' and 'rzp_test_placeholder' in txt and not str(p).endswith('Test.kt'):
                          bad.append(f'Placeholder Razorpay key in {p}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('Static policy checks passed (Google Fonts allowed, FCM-only enforced).')
          "

      - name: Validate Alembic migrations against PostgreSQL 18
        env:
          TESTING: "0"
          ENVIRONMENT: "test"
          DATABASE_URL: "postgresql+asyncpg://erickshaw_test:erickshaw_test_password@127.0.0.1:5432/erickshaw_test_db"
          DATABASE_URL_SYNC: "postgresql+psycopg2://erickshaw_test:erickshaw_test_password@127.0.0.1:5432/erickshaw_test_db"
        run: |
          alembic heads
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run PostgreSQL financial concurrency integration tests
        env:
          TESTING: "1"
          ENVIRONMENT: "test"
          POSTGRES_TEST_DATABASE_URL: "postgresql+asyncpg://erickshaw_test:erickshaw_test_password@127.0.0.1:5432/erickshaw_test_db"
          TEST_POSTGRES_URL: "postgresql+asyncpg://erickshaw_test:erickshaw_test_password@127.0.0.1:5432/erickshaw_test_db"
        run: |
          pytest backend/tests/integration/test_postgres_financial_concurrency.py -rs -v --tb=short

      - name: Run real Redis distributed-lock integration tests
        env:
          TESTING: "1"
          ENVIRONMENT: "test"
          REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
        run: |
          pytest backend/tests/integration/test_redis_distributed_lock.py -rs -v --tb=short

      - name: Run full backend pytest suite
        env:
          TESTING: "1"
          ENVIRONMENT: "test"
          POSTGRES_TEST_DATABASE_URL: "postgresql+asyncpg://erickshaw_test:erickshaw_test_password@127.0.0.1:5432/erickshaw_test_db"
          TEST_POSTGRES_URL: "postgresql+asyncpg://erickshaw_test:erickshaw_test_password@127.0.0.1:5432/erickshaw_test_db"
          REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
          PYTHONFAULTHANDLER: "1"
        run: |
          pytest backend/tests -rs -v --tb=short \\
            --timeout=180 \\
            --timeout-method=thread \\
            -o faulthandler_timeout=120 \\
            --durations=30

  android-build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Verify Mapbox Maven token is configured
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::Repository secret MAPBOX_DOWNLOADS_TOKEN is required to resolve Mapbox Android SDK artifacts."
            exit 1
          fi

      - name: Compile, assemble, test, and lint Customer and Driver Android variants
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          ./gradlew \
            :apps:customer-android:assembleDevDebug \
            :apps:driver-android:assembleDebug \
            :apps:customer-android:testDevDebugUnitTest \
            :apps:driver-android:testDebugUnitTest \
            :apps:customer-android:lintDevDebug \
            :apps:driver-android:lintDebug \
            --no-daemon

      - name: Verify Android ProGuard and FCM release config
        run: |
          test -f apps/customer-android/proguard-rules.pro
          test -f apps/driver-android/proguard-rules.pro
          grep -q "com.razorpay" apps/customer-android/proguard-rules.pro
